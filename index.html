  * { box-sizing: border-box; }
  html, body {

  }

    width: 480px;
    border: 6px solid #306230;

    background: #0f380f;
    box-shadow: 0 0 0 4px #0f380f, 0 0 20px rgba(0,0,0,0.6);
    padding: 8px;
  }
  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    background: #306230;
    color: #9bbc0f;
    padding: 6px 8px;
    font-size: 13px;
    font-weight: bold;

    letter-spacing: 0.5px;
  }

  #canvasWrap {
    position: relative;
    margin-top: 6px;
    border: 3px solid #306230;
    border-radius: 4px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #8bac0f;
    image-rendering: pixelated;
    width: 100%;
    height: auto;
  }
  #flashOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ff0000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.08s linear;
  }
  #flashOverlay.active { opacity: 0.45; }

  #dialogBox {
    margin-top: 6px;
    min-height: 54px;
    background: #0f380f;
    border: 3px solid #9bbc0f;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.4;
    color: #9bbc0f;
  }
  #dialogBox.hidden { display: none; }
  #dialogBox .hint {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.7;
  }

  #controlsHint {
    margin-top: 6px;
    font-size: 11px;
    text-align: center;
    color: #8bac0f;
  }

  /* ---- Modal overlays (quiz / game over) ---- */
  .modalOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 56, 15, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modalOverlay.hidden { display: none; }
  .modalBox {
    width: 380px;
    max-width: 90vw;
    background: #0f380f;
    border: 4px solid #9bbc0f;
    border-radius: 8px;
    padding: 18px;
    text-align: center;
  }
  .modalBox h2 {
    margin: 0 0 10px 0;
    color: #9bbc0f;
    font-size: 18px;
  }
  .modalBox p { font-size: 13px; margin: 8px 0 14px 0; }
  .quizOption {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    background: #306230;
    color: #9bbc0f;
    border: 2px solid #9bbc0f;
    border-radius: 4px;
    cursor: pointer;
  }
  .quizOption:hover { background: #8bac0f; color: #0f380f; }
  .quizProgress { font-size: 11px; opacity: 0.8; margin-bottom: 6px; }

  #restartBtn {
    margin-top: 10px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 14px;
    background: #8bac0f;
    color: #0f380f;
    border: 2px solid #0f380f;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  #restartBtn:hover { background: #9bbc0f; }

</head>

<div id="app">

/* ---------------------------------------------------------------------
   DATA LAYER: fixed single-screen tile layout (re-used by every level;
   never regenerated). Coordinates are canvas pixels (480x360 internal).
--------------------------------------------------------------------- */
const PLAYER_START = { x: 210, y: 300 };
const PLAYER_SIZE = 28;

const TILE_SIZE = 60;
const LAYOUT = {
  officer:  { x: 200, y: 26,  w: 80, h: 50, type: "officer" },
  clue1:    { x: 36,  y: 138, w: TILE_SIZE, h: TILE_SIZE, type: "clue" },
  clue2:    { x: 384, y: 138, w: TILE_SIZE, h: TILE_SIZE, type: "clue" },
  hazard1:  { x: 36,  y: 262, w: TILE_SIZE, h: TILE_SIZE, type: "hazard" },
  hazard2:  { x: 384, y: 262, w: TILE_SIZE, h: TILE_SIZE, type: "hazard" }
};

/* =====================================================================
   LOGIC / MIDDLEWARE LAYER
   ===================================================================== */

// ---- Persistent run state (never resets on level transition, only on restart) ----
let riskMeter = 0;
let stamps = 0;
let levelIndex = 1; // absolute level count across the whole run (keeps climbing past 20)
let currentLevel = LEVELS[(levelIndex - 1) % LEVELS.length];

// ---- Per-level transient state ----
let player = { x: PLAYER_START.x, y: PLAYER_START.y };
let hazardVisited = { hazard1: false, hazard2: false }; // reset each level load & when player leaves the tile

// ---- Finite state machine: 'playing' | 'dialog' | 'quiz' | 'gameover' ----
let gameState = 'playing';

// Queued action to run once the current dialog box is dismissed (e.g. open quiz)
let pendingAfterDialog = null;

// ---- Input tracking ----
const keysDown = new Set();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const flashOverlay = document.getElementById('flashOverlay');

const hudCountry = document.getElementById('hudCountry');
const hudRisk = document.getElementById('hudRisk');
const hudStamps = document.getElementById('hudStamps');
const hudLevel = document.getElementById('hudLevel');

const dialogBox = document.getElementById('dialogBox');
const dialogText = document.getElementById('dialogText');

const quizModal = document.getElementById('quizModal');
const quizProgress = document.getElementById('quizProgress');
const quizCountryName = document.getElementById('quizCountryName');
const quizQuestion = document.getElementById('quizQuestion');
const quizOptionA = document.getElementById('quizOptionA');
const quizOptionB = document.getElementById('quizOptionB');

const gameOverModal = document.getElementById('gameOverModal');
const gameOverStats = document.getElementById('gameOverStats');
const restartBtn = document.getElementById('restartBtn');

/* ---------------------------------------------------------------------
   Damage formula: base 35% on Level 1, +5% per level index thereafter.
   Uses the ABSOLUTE level index (keeps scaling after the 20-country
   rotation loops back around), not the looped country slot.
--------------------------------------------------------------------- */
function currentHazardDamage() {
  return HAZARD_BASE_DAMAGE + HAZARD_DAMAGE_STEP * (levelIndex - 1);
}

function updateHUD() {
  hudCountry.textContent = `Country: ${currentLevel.country}`;
  hudRisk.textContent = `Risk: ${Math.round(riskMeter)}%`;
  hudStamps.textContent = `Stamps: ${stamps}`;
  hudLevel.textContent = `Level: ${levelIndex}`;
}

function loadLevel(idx) {
  levelIndex = idx;
  currentLevel = LEVELS[(levelIndex - 1) % LEVELS.length];
  player.x = PLAYER_START.x;
  player.y = PLAYER_START.y;
  hazardVisited = { hazard1: false, hazard2: false };
  updateHUD();
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function playerRect() {
  return { x: player.x, y: player.y, w: PLAYER_SIZE, h: PLAYER_SIZE };
}

function showDialog(message, after) {
  dialogText.textContent = message;
  dialogBox.classList.remove('hidden');
  gameState = 'dialog';
  pendingAfterDialog = after || null;
}

function dismissDialog() {
  dialogBox.classList.add('hidden');
  gameState = 'playing';
  const next = pendingAfterDialog;
  pendingAfterDialog = null;
  if (next) next();
}

function flashRed() {
  flashOverlay.classList.add('active');
  setTimeout(() => flashOverlay.classList.remove('active'), 160);
}

function triggerHazard() {
  const dmg = currentHazardDamage();
  riskMeter = Math.min(RISK_MAX, riskMeter + dmg);
  flashRed();
  updateHUD();
  if (riskMeter >= RISK_MAX) {
    showDialog(`OUCH! A cultural misstep cost you ${dmg}% Risk!`, () => triggerGameOver());
  } else {
    showDialog(`OUCH! A cultural misstep cost you ${dmg}% Risk!`);
  }
}

function triggerGameOver() {
  gameState = 'gameover';
  gameOverStats.textContent = `Final Level Reached: ${levelIndex} — Passport Stamps: ${stamps}`;
  gameOverModal.classList.remove('hidden');
}

function restartGame() {
  riskMeter = 0;
  stamps = 0;
  loadLevel(1);
  gameOverModal.classList.add('hidden');
  dialogBox.classList.add('hidden');
  gameState = 'playing';
}

/* ---------------------------------------------------------------------
   Quiz flow
--------------------------------------------------------------------- */
let quizQuestionIdx = 0;
let quizCorrectCount = 0;

function openQuiz() {
  gameState = 'quiz';
  quizQuestionIdx = 0;
  quizCorrectCount = 0;
  quizCountryName.textContent = `Customs Check — ${currentLevel.country}`;
  renderQuizQuestion();
  quizModal.classList.remove('hidden');
}

function renderQuizQuestion() {
  const q = currentLevel.quiz[quizQuestionIdx];
  quizProgress.textContent = `Question ${quizQuestionIdx + 1} of ${currentLevel.quiz.length}`;
  quizQuestion.textContent = q.q;
  quizOptionA.textContent = q.options[0];
  quizOptionB.textContent = q.options[1];
}

function answerQuiz(selectedIndex) {
  const q = currentLevel.quiz[quizQuestionIdx];
  if (selectedIndex === q.correct) quizCorrectCount++;
  quizQuestionIdx++;
  if (quizQuestionIdx < currentLevel.quiz.length) {
    renderQuizQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  quizModal.classList.add('hidden');
  const passed = quizCorrectCount === currentLevel.quiz.length;
  if (passed) {
    stamps++;
    riskMeter = Math.max(0, riskMeter - RISK_REDUCTION_ON_PASS);
    updateHUD();
    const clearedCountry = currentLevel.country;
    const nextIdx = levelIndex + 1;
    showDialog(`Passport stamped for ${clearedCountry}! Risk -${RISK_REDUCTION_ON_PASS}%. Welcome to your next destination.`, () => {
      loadLevel(nextIdx);
    });
  } else {
    showDialog(`Quiz failed! The officer sends you back to review the clues and try again.`);
  }
}

quizOptionA.addEventListener('click', () => answerQuiz(0));
quizOptionB.addEventListener('click', () => answerQuiz(1));
restartBtn.addEventListener('click', restartGame);

/* ---------------------------------------------------------------------
   Input handling
--------------------------------------------------------------------- */
const MOVE_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD']);
const INTERACT_KEYS = new Set(['Space','KeyZ']);

window.addEventListener('keydown', (e) => {
  if (MOVE_KEYS.has(e.code)) { keysDown.add(e.code); e.preventDefault(); }

  if (INTERACT_KEYS.has(e.code) && !e.repeat) {
    e.preventDefault();
    handleInteract();
  }
});

window.addEventListener('keyup', (e) => {
  if (MOVE_KEYS.has(e.code)) keysDown.delete(e.code);
});

function handleInteract() {
  if (gameState === 'dialog') {
    dismissDialog();
    return;
  }
  if (gameState !== 'playing') return; // ignore during quiz/gameover

  const pRect = playerRect();

  if (rectsOverlap(pRect, LAYOUT.officer)) {
    openQuiz();
    return;
  }
  if (rectsOverlap(pRect, LAYOUT.clue1)) {
    showDialog(currentLevel.clue1);
    return;
  }
  if (rectsOverlap(pRect, LAYOUT.clue2)) {
    showDialog(currentLevel.clue2);
    return;
  }
}

/* ---------------------------------------------------------------------
   Update loop: movement + automatic hazard detection
--------------------------------------------------------------------- */
const SPEED = 3;

function update() {
  if (gameState === 'playing') {
    let dx = 0, dy = 0;
    if (keysDown.has('ArrowUp') || keysDown.has('KeyW')) dy -= 1;
    if (keysDown.has('ArrowDown') || keysDown.has('KeyS')) dy += 1;
    if (keysDown.has('ArrowLeft') || keysDown.has('KeyA')) dx -= 1;
    if (keysDown.has('ArrowRight') || keysDown.has('KeyD')) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; } // normalize diagonal speed

    player.x = Math.max(4, Math.min(canvas.width - PLAYER_SIZE - 4, player.x + dx * SPEED));
    player.y = Math.max(4, Math.min(canvas.height - PLAYER_SIZE - 4, player.y + dy * SPEED));

    // Automatic hazard trigger on overlap (stepping onto the tile)
    const pRect = playerRect();
    ['hazard1', 'hazard2'].forEach((key) => {
      const overlapping = rectsOverlap(pRect, LAYOUT[key]);
      if (overlapping && !hazardVisited[key]) {
        hazardVisited[key] = true;
        triggerHazard();
      } else if (!overlapping) {
        hazardVisited[key] = false;
      }
    });
  }
}

/* ---------------------------------------------------------------------
   Render loop (Canvas2D) — GB-blocky tiles, accent color per level
--------------------------------------------------------------------- */
function drawTile(tile, label, fillColor, textColor) {
  ctx.fillStyle = fillColor;
  ctx.fillRect(tile.x, tile.y, tile.w, tile.h);
  ctx.strokeStyle = PALETTE.darkest;
  ctx.lineWidth = 3;
  ctx.strokeRect(tile.x, tile.y, tile.w, tile.h);
  ctx.fillStyle = textColor;
  ctx.font = 'bold 26px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, tile.x + tile.w / 2, tile.y + tile.h / 2 + 2);
}

function render() {
  // Background
  ctx.fillStyle = PALETTE.light;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Accent border frame representing current country theme
  ctx.strokeStyle = currentLevel.accent;
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);

  // Clue tiles
  drawTile(LAYOUT.clue1, '?', PALETTE.lightest, PALETTE.darkest);
  drawTile(LAYOUT.clue2, '?', PALETTE.lightest, PALETTE.darkest);

  // Hazard tiles
  drawTile(LAYOUT.hazard1, '!', PALETTE.darkest, PALETTE.lightest);
  drawTile(LAYOUT.hazard2, '!', PALETTE.darkest, PALETTE.lightest);

  // Officer / exit gate (accent colored)
  drawTile(LAYOUT.officer, 'C', currentLevel.accent, PALETTE.darkest);
  ctx.fillStyle = PALETTE.darkest;
  ctx.font = 'bold 10px Courier New';
  ctx.fillText('CUSTOMS', LAYOUT.officer.x + LAYOUT.officer.w / 2, LAYOUT.officer.y + LAYOUT.officer.h + 10);

  // Player
  ctx.fillStyle = PALETTE.darkest;
  ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
  ctx.fillStyle = currentLevel.accent;
  ctx.fillRect(player.x + 4, player.y + 4, PLAYER_SIZE - 8, PLAYER_SIZE - 8);
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
loadLevel(1);
gameLoop();
</script>
